name: CI-CD Pipeline

on:
  push:
    branches: [develop, staging, main]
  pull_request:

permissions:
  id-token: write   # REQUIRED for OIDC (modern AWS auth)
  contents: read

env:
  NODE_VERSION: 20

jobs:

  # =========================
  # CI (common for all)
  # =========================
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist


  # =========================
  # Deploy DEV
  # =========================
  deploy-dev:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev   # 👈 THIS FIXES YOUR ISSUE

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"


  # =========================
  # Deploy STAGING
  # =========================
  deploy-staging:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging   # 👈 MUST match env name in GitHub

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"


  # =========================
  # Deploy PROD
  # =========================
  deploy-prod:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod   # 👈 MUST match env name

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"