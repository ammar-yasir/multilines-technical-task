name: CI-CD Pipeline

on:
  push:
    branches: [develop, staging, main]
  pull_request:

permissions:
  id-token: write   # REQUIRED for OIDC (modern AWS auth)
  contents: read

env:
  NODE_VERSION: 20

jobs:

  # =========================
  # CI: lint + test + build
  # =========================
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist


  # =========================
  # PR PREVIEW DEPLOYMENT
  # =========================
  deploy-preview:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set PR folder
        id: pr
        run: echo "folder=previews/pr-${{ github.event.number }}" >> $GITHUB_OUTPUT

      - name: Sync PR build to S3 (Preview)
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }}/${{ steps.pr.outputs.folder }} \
            --delete

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const url = `https://${{ secrets.CLOUDFRONT_DOMAIN }}/previews/pr-${pr}/`;

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr,
              body: `🚀 PR Preview is ready:\n\n${url}`
            });


  # =========================
  # PR CLEANUP
  # =========================
  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Delete PR folder from S3
        run: |
          aws s3 rm s3://${{ env.S3_BUCKET }}/previews/pr-${{ github.event.number }} \
            --recursive


  # =========================
  # Deploy to DEV Env => AWS (S3 + CloudFront)
  # =========================
  deploy-dev:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev   # 👈 MUST match env name in GitHub

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"


  # =========================
  # Deploy STAGING
  # =========================
  deploy-staging:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging   # 👈 MUST match env name in GitHub

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws s3 sync dist s3://${{ env.S3_BUCKET }}/staging --delete

      - run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"


  # =========================
  # Deploy PROD
  # =========================
  deploy-prod:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod   # 👈 MUST match env name in GitHub

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete

      - run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"